[project]
name = "papertranslator-babelko"
version = "0.1.0a1"
description = "Korean PDF workbench using PDFMathTranslate-next and BabelDOC"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "BabelDOC==0.6.4",
  "PySide6-Essentials>=6.8,<6.11",
  "pydantic-settings>=2.8,<3",
  "tomlkit>=0.13,<1",
  "requests>=2.32,<3",
  "bitstring==4.3.1",
  "rapidocr-onnxruntime==1.4.4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pillow>=11,<13", "pyinstaller>=6,<7"]

[tool.uv.sources]
BabelDOC = { path = "upstream/BabelDOC", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babelko"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
